[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-eval"
version = "0.1.0"
description = "Local-first CV scoring against explainable hiring rubrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TALOS" }]
keywords = ["resume", "cv", "llm", "ollama", "hiring", "rubric", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "PyMuPDF==1.26.3",
    "pymupdf4llm==0.0.27",
    "pydantic==2.11.7",
    "Jinja2==3.1.6",
    "requests==2.32.5",
    "python-dotenv==1.2.2",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "typer==0.16.0",
    "httpx==0.28.1",
]

[project.urls]
Homepage = "https://github.com/taltara/HackerAgentRank"
Repository = "https://github.com/taltara/HackerAgentRank"
Issues = "https://github.com/taltara/HackerAgentRank/issues"

[project.scripts]
cv-eval = "cv_eval.cli:app"

[tool.setuptools.packages.find]
include = ["cv_eval*"]

[tool.setuptools.package-data]
cv_eval = [
    "core/prompts/templates/*.jinja",
    "core/*.json",
    "core/*.md",
    "rubrics/*/*.json",
    "rubrics/*/*.jinja",
]
